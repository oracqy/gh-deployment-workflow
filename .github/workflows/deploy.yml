name: Deploy Static HTML to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 1. NOWE ZADANIE: Testowanie kodu (Linting)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Instalacja środowiska Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalacja narzędzia HTMLHint
        run: npm install -g htmlhint

      - name: Sprawdzenie poprawności pliku index.html
        # Sprawdza kod i przerywa akcję, jeśli znajdzie błędy
        run: htmlhint "index.html"

  # 2. ZMODYFIKOWANE ZADANIE: Wdrożenie
  deploy:
    needs: test # KLUCZOWE: Uruchom wdrożenie TYLKO jeśli 'test' zakończy się sukcesem
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja GitHub Pages
        uses: actions/configure-pages@v4

      - name: Przesłanie plików (Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Wdrożenie na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
